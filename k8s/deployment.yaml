apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: whisper
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: 10.1.1.29:5000/whisper-api:transformers-gpu-app-fp16-input-fix
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: whisper-config
          env:
            - name: ASR_BACKEND
              value: transformers
            - name: STREAM_MODEL
              value: openai/whisper-small
            - name: DEVICE
              value: auto
            - name: COMPUTE_TYPE
              value: float16
            - name: EMBEDDING_DEVICE
              value: cpu
          # GB10 單節點 GPU 共享：API ASR 使用 1 個 time-slicing GPU slot。
          # Embedding 固定使用 CPU，避免和 ASR、LLM 競爭 GPU memory。
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
