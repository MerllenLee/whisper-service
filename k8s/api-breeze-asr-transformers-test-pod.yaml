apiVersion: v1
kind: Pod
metadata:
  name: api-breeze-asr-transformers-test
  namespace: whisper
  labels:
    app: api-breeze-asr-transformers-test
spec:
  restartPolicy: Never
  nodeSelector:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.sharing-strategy: time-slicing
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: asr
      image: 10.1.1.29:5000/whisper-api:transformers-gpu-app-fp16-input-fix
      imagePullPolicy: Never
      command:
        - /bin/bash
        - -lc
      args:
        - |
          set -euo pipefail

          python3 - <<'PY'
          import numpy as np
          import torch
          from transformers import AutoModelForSpeechSeq2Seq, AutoProcessor, pipeline

          model_id = "MediaTek-Research/Breeze-ASR-25"
          device = "cuda:0" if torch.cuda.is_available() else "cpu"
          dtype = torch.float16 if torch.cuda.is_available() else torch.float32

          print("torch:", torch.__version__, flush=True)
          print("cuda available:", torch.cuda.is_available(), flush=True)
          if torch.cuda.is_available():
              print("cuda device:", torch.cuda.get_device_name(0), flush=True)

          processor = AutoProcessor.from_pretrained(model_id)
          model = AutoModelForSpeechSeq2Seq.from_pretrained(
              model_id,
              torch_dtype=dtype,
              low_cpu_mem_usage=True,
              use_safetensors=True,
          ).to(device).eval()

          asr = pipeline(
              "automatic-speech-recognition",
              model=model,
              tokenizer=processor.tokenizer,
              feature_extractor=processor.feature_extractor,
              torch_dtype=dtype,
              device=0 if torch.cuda.is_available() else -1,
          )

          audio = np.zeros(16000, dtype=np.float32)
          result = asr(
              {"array": audio, "sampling_rate": 16000},
              generate_kwargs={"language": "zh", "task": "transcribe"},
          )

          print(f"loaded model: {model_id}", flush=True)
          print("model class:", model.__class__.__name__, flush=True)
          print("processor:", processor.__class__.__name__, flush=True)
          print("device:", device, flush=True)
          print("dtype:", dtype, flush=True)
          print("empty-audio result:", result.get("text", ""), flush=True)
          PY

          sleep 120
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu: "1"
