apiVersion: v1
kind: Pod
metadata:
  name: llama-breeze2-wrapper-test
  namespace: whisper
  labels:
    app: llama-breeze2-wrapper-test
spec:
  restartPolicy: Never
  nodeSelector:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.sharing-strategy: time-slicing
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: llm
      image: whisper-llm-breeze2-wrapper:test
      imagePullPolicy: Never
      ports:
        - containerPort: 8001
      env:
        - name: MODEL_ID
          value: MediaTek-Research/Llama-Breeze2-8B-Instruct
        - name: MODEL_PATH
          value: /models/llama-breeze2-8b-instruct
        - name: IMG_CONTEXT_TOKEN_ID
          value: "128212"
        - name: DEFAULT_MAX_NEW_TOKENS
          value: "2048"
        - name: DEFAULT_TEMPERATURE
          value: "0.3"
      resources:
        requests:
          cpu: "2"
          memory: 24Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "6"
          memory: 64Gi
          nvidia.com/gpu: "1"
